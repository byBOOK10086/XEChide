name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: host tests (matching + parcel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: make -C tests/host

  ctl-build:
    name: root helper compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: cc -std=c11 -Wall -Wextra -Werror -D_GNU_SOURCE -o "$RUNNER_TEMP/xechide-ctl" ctl/xechide-ctl.c

      - name: Self-check
        run: |
          "$RUNNER_TEMP/xechide-ctl" version
          "$RUNNER_TEMP/xechide-ctl" --help || test $? -eq 2

  patch-apply:
    name: patch applies to stock KernelSU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned KernelSU tree
        run: |
          git init --quiet "$RUNNER_TEMP/ksu"
          cd "$RUNNER_TEMP/ksu"
          git remote add origin https://github.com/tiann/KernelSU.git
          git fetch --quiet --depth 1 origin 0faec0cc7b5f655170d89bf9c4d28bb5ca271fa2
          git checkout --quiet FETCH_HEAD
          echo "base: $(git rev-parse HEAD)"

      - name: Check the patch
        run: |
          cd "$RUNNER_TEMP/ksu"
          git apply --check -v "$GITHUB_WORKSPACE/patches/xechide-core.patch"

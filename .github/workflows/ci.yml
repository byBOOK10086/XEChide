name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi-cross-check:
    name: ABI cross-check (kernel / app / helper / patch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/abi_check.py

  host-tests:
    name: host tests (matching + parcel + ASan fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, run and fuzz
        run: make -C tests/host

  module-build:
    name: Zygisk module (arm64) + zip lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch zig (bundled clang, freestanding android target)
        run: |
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"

      - name: Build, package and lint
        run: ZIG="$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" bash module/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xechide-module
          path: module/out/*.zip
          if-no-files-found: error

  ctl-build:
    name: root helper compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: cc -std=c11 -Wall -Wextra -Werror -D_GNU_SOURCE -o "$RUNNER_TEMP/xechide-ctl" ctl/xechide-ctl.c

      - name: Self-check
        run: |
          "$RUNNER_TEMP/xechide-ctl" version
          "$RUNNER_TEMP/xechide-ctl" --help || test $? -eq 2

  helper-aarch64:
    name: root helper (arm64 static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch zig (bundled clang + musl)
        run: |
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"

      - name: Build xechide-ctl
        run: |
          "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" cc             -target aarch64-linux-musl -static -std=c11 -Wall -Wextra -Werror -D_GNU_SOURCE             -o xechide-ctl-arm64 ctl/xechide-ctl.c
          file xechide-ctl-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: xechide-ctl-arm64
          path: xechide-ctl-arm64
          if-no-files-found: error

  patch-apply:
    name: patch applies to stock KernelSU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned KernelSU tree
        run: |
          git init --quiet "$RUNNER_TEMP/ksu"
          cd "$RUNNER_TEMP/ksu"
          git remote add origin https://github.com/tiann/KernelSU.git
          git fetch --quiet --depth 1 origin 0faec0cc7b5f655170d89bf9c4d28bb5ca271fa2
          git checkout --quiet FETCH_HEAD
          echo "base: $(git rev-parse HEAD)"

      - name: Check the patch
        run: |
          cd "$RUNNER_TEMP/ksu"
          git apply --check -v "$GITHUB_WORKSPACE/patches/xechide-core.patch"

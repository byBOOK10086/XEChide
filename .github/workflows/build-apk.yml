# SPDX-License-Identifier: GPL-3.0-only
name: build-apk

# Produces an installable debug APK with the root helper already bundled.
# This is the only job that needs the Android toolchain and network access to
# Maven; it is manual (or tag driven) instead of running on every push.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: manager APK (arm64 helper included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch zig (bundled clang + musl)
        run: |
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"

      - name: Build the root helper into the APK assets
        run: |
          "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" cc \
            -target aarch64-linux-musl -static -std=c11 -Wall -Wextra -Werror -D_GNU_SOURCE \
            -o manager/app/src/main/assets/xechide-ctl-arm64 ctl/xechide-ctl.c
          chmod 0755 manager/app/src/main/assets/xechide-ctl-arm64
          file manager/app/src/main/assets/xechide-ctl-arm64
          sha256sum manager/app/src/main/assets/xechide-ctl-arm64

      - name: Build the Zygisk module zip
        run: ZIG="$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" bash module/build.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble
        working-directory: manager
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect
        run: |
          mkdir -p out
          cp manager/app/build/outputs/apk/debug/app-debug.apk out/xechide-manager-debug.apk
          cp module/out/*.zip out/
          sha256sum out/* | tee out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: xechide-manager-debug
          path: out/
          if-no-files-found: error
